<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="ai1" cx="15%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#EE0000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#EE0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai2" cx="90%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#137fec" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#137fec" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c4255"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#0a0f14"/>
  <rect width="800" height="480" fill="url(#ai1)"/>
  <rect width="800" height="480" fill="url(#ai2)"/>

  <text x="40" y="38" fill="#92adc9" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ANSIBLE · CLÚSTER DISTRIBUIDO (4 NODOS)</text>

  <!-- bastion / control node -->
  <g>
    <rect x="300" y="60" width="200" height="56" rx="14" fill="#111820" stroke="#EE0000" stroke-opacity="0.55"/>
    <circle cx="322" cy="88" r="5" fill="#EE0000"/>
    <text x="338" y="92" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="800">Bastión / Control</text>
    <text x="322" y="106" fill="#92adc9" font-family="Inter, sans-serif" font-size="10.5">ansible-playbook · SSH</text>
  </g>

  <!-- dashed ssh lines to 4 nodes -->
  <g stroke="#EE0000" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
    <path d="M360,116 L140,230"/>
    <path d="M380,116 L320,230"/>
    <path d="M420,116 L500,230"/>
    <path d="M440,116 L670,230"/>
  </g>

  <!-- node row -->
  <g font-family="Inter, sans-serif">
    <g>
      <rect x="60" y="230" width="160" height="110" rx="14" fill="#111820" stroke="#1e2936"/>
      <circle cx="82" cy="254" r="5" fill="#8b5cf6"/>
      <text x="98" y="259" fill="#ffffff" font-size="14" font-weight="800">edge</text>
      <text x="82" y="280" fill="#92adc9" font-size="10.5">nginx · TLS/SNI</text>
      <text x="82" y="296" fill="#92adc9" font-size="10.5">Grafana · Prometheus</text>
      <text x="82" y="312" fill="#92adc9" font-size="10.5">Dozzle · cAdvisor</text>
    </g>
    <g>
      <rect x="240" y="230" width="160" height="110" rx="14" fill="#111820" stroke="#1e2936"/>
      <circle cx="262" cy="254" r="5" fill="#137fec"/>
      <text x="278" y="259" fill="#ffffff" font-size="14" font-weight="800">worker 1</text>
      <text x="262" y="280" fill="#92adc9" font-size="10.5">diploma-backend</text>
      <text x="262" y="296" fill="#92adc9" font-size="10.5">servicio-diploma</text>
      <text x="262" y="312" fill="#92adc9" font-size="10.5">firma-digital-wrapper</text>
    </g>
    <g>
      <rect x="420" y="230" width="160" height="110" rx="14" fill="#111820" stroke="#1e2936"/>
      <circle cx="442" cy="254" r="5" fill="#137fec"/>
      <text x="458" y="259" fill="#ffffff" font-size="14" font-weight="800">worker 2</text>
      <text x="442" y="280" fill="#92adc9" font-size="10.5">servicio-diploma</text>
      <text x="442" y="296" fill="#92adc9" font-size="10.5">firma-digital-wrapper</text>
      <text x="442" y="312" fill="#92adc9" font-size="10.5">(réplica)</text>
    </g>
    <g>
      <rect x="600" y="230" width="160" height="110" rx="14" fill="#111820" stroke="#1e2936"/>
      <circle cx="622" cy="254" r="5" fill="#22c55e"/>
      <text x="638" y="259" fill="#ffffff" font-size="14" font-weight="800">datos</text>
      <text x="622" y="280" fill="#92adc9" font-size="10.5">PostgreSQL · PgBouncer</text>
      <text x="622" y="296" fill="#92adc9" font-size="10.5">Redis</text>
      <text x="622" y="312" fill="#92adc9" font-size="10.5">MinIO / Silo (S3)</text>
    </g>
  </g>

  <!-- routing + data arrows -->
  <g stroke="#2c4255" stroke-width="2" fill="none">
    <path d="M220,270 L240,270" marker-end="url(#arrowA)"/>
    <path d="M220,300 L420,300" marker-end="url(#arrowA)"/>
    <path d="M400,270 L600,250" marker-end="url(#arrowA)"/>
    <path d="M580,270 L600,270" marker-end="url(#arrowA)"/>
  </g>

  <!-- bottom band -->
  <rect x="40" y="396" width="720" height="48" rx="14" fill="#EE0000" fill-opacity="0.08" stroke="#EE0000" stroke-opacity="0.35"/>
  <text x="400" y="425" fill="#ffd6d6" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Promoción por git tag · ansible-vault por entorno · mise run up / down / reset</text>
</svg>
