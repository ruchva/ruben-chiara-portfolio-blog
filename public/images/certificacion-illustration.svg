<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <radialGradient id="gc1" cx="20%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="480" fill="#0a0f14"/>
  <rect width="800" height="480" fill="url(#gc1)"/>

  <!-- document card -->
  <g transform="translate(280,60)">
    <rect x="0" y="0" width="260" height="340" rx="18" fill="#111820" stroke="#1e2936"/>
    <rect x="28" y="36" width="140" height="12" rx="6" fill="#1e2936"/>
    <rect x="28" y="62" width="180" height="8" rx="4" fill="#1e2936"/>
    <rect x="28" y="80" width="150" height="8" rx="4" fill="#1e2936"/>
    <rect x="28" y="98" width="170" height="8" rx="4" fill="#1e2936"/>

    <!-- qr-like grid -->
    <g fill="#1e2936">
      <rect x="28" y="140" width="10" height="10"/><rect x="46" y="140" width="10" height="10"/><rect x="64" y="140" width="10" height="10"/>
      <rect x="28" y="158" width="10" height="10"/><rect x="64" y="158" width="10" height="10"/>
      <rect x="28" y="176" width="10" height="10"/><rect x="46" y="176" width="10" height="10"/><rect x="64" y="176" width="10" height="10"/>
    </g>

    <!-- seal -->
    <circle cx="180" cy="250" r="54" fill="#0a0f14" stroke="#22c55e" stroke-width="3" stroke-opacity="0.55"/>
    <circle cx="180" cy="250" r="54" fill="#22c55e" fill-opacity="0.08"/>
    <path d="M156,250 l16,16 l34,-38" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="40" y="370" width="220" height="56" rx="14" fill="#111820" stroke="#1e2936"/>
    <circle cx="62" cy="398" r="5" fill="#22c55e"/>
    <text x="78" y="394" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="800">Validación</text>
    <text x="78" y="412" fill="#92adc9" font-family="Inter, sans-serif" font-size="10.5">pública con pasarela de pagos</text>
  </g>

  <text x="40" y="60" fill="#92adc9" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CERTIFICACIÓN DE DIPLOMAS</text>
</svg>
